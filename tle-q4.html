<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLE ICT - 4th Quarter</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
/* RESET & BODY */
* {
    margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif;
}
:root{
    --red:#c20d0d;
    --blue:#0050a0;
    --darkblue:rgba(0,26,82,0.9);
    --yellow:#f8d210;
    --white:#ffffff;
}

body{
    background:linear-gradient(135deg,#4a90e2,#6bb6ff);
    color:var(--white);
    padding-top:100px;
}

/* NAVBAR */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background-color:var(--darkblue);
    padding:20px 70px;
    position:fixed;
    top:0;
    width:100%;
    z-index:10;
}
.logo{font-size:1.8rem; font-weight:800;}
nav ul{list-style:none; display:flex; gap:25px;}
nav ul li a{
    text-decoration:none;
    color:var(--white);
    background-color:var(--red);
    padding:8px 18px;
    border-radius:8px;
    font-weight:600;
}
.grade{
    background-color:var(--yellow);
    color:var(--darkblue);
    padding:8px 18px;
    border-radius:25px;
    font-weight:600;
}

/* HEADLINE */
.headline{
    background-color:var(--red);
    border-top:4px solid var(--yellow);
    border-bottom:4px solid var(--yellow);
    text-align:center;
    padding:20px;
    font-size:2rem;
    font-weight:800;
    margin-top:30px;
}

/* LESSON BUTTONS */
.lesson-list{
    width:90%;
    margin:40px auto;
}
.lesson{
    display:block;
    background:#002060;
    color:white;
    padding:18px;
    margin:10px 0;
    text-decoration:none;
    border:3px solid var(--yellow);
    font-weight:700;
    text-align:center;
}
.lesson:hover{
    background:#00359c;
}

/* 4TH QUARTER EVENTS GALLERY */
.gallery{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:40px auto;
    width:90%;
    flex-wrap:wrap;
}
.gallery .card{
    width:300px; /* 3 per row */
    text-align:center;
}
.gallery .card img{
    width:100%;
    height:200px;
    object-fit:cover;
    border:4px solid var(--yellow);
    border-radius:15px;
}
.caption{
    margin-top:10px;
    background-color:var(--red);
    border:3px solid var(--yellow);
    padding:8px;
    border-radius:8px;
    font-weight:600;
}

/* NOLI ME TANGERE IMAGES (PORTRAIT) */
.gallery.noli{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:40px auto;
    width:90%;
    flex-wrap:wrap;
}
.gallery.noli .card{
    max-width:250px;  /* container for portrait images */
    text-align:center;
}
.gallery.noli .card img{
    width:auto;
    max-width:100%;
    height:400px;       /* fixed height for consistency */
    object-fit:contain;  /* prevents cropping */
    border:4px solid var(--yellow);
    border-radius:15px;
}

/* VIDEO LINK */
.video-link{
    text-align:center;
    margin-top:20px;
}
.video-link a{
    background-color:var(--red);
    border:3px solid var(--yellow);
    padding:12px 25px;
    border-radius:8px;
    color:white;
    text-decoration:none;
    font-weight:700;
}

/* BOTTOM RETURN BUTTON */
.bottom{
    display:flex;
    justify-content:center;
    margin:60px;
}
.btn{
    background-color:var(--red);
    color:white;
    padding:18px 40px;
    border:3px solid var(--yellow);
    border-radius:10px;
    text-decoration:none;
    font-weight:700;
}
.btn:hover{
    background-color:var(--darkblue);
}
</style>
</head>
<body>

<header>
    <div class="logo">E-PORTFOLIO</div>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="personal.html">Personal Space</a></li>
            <li><a href="tle.html">TLE-ICT</a></li>
            <li><a href="ap.html">AP</a></li>
        </ul>
    </nav>
    <div class="grade">Grade 9 - Fairness</div>
</header>

<div class="headline">LESSONS</div>
<section class="lesson-list">
    <a href="#" class="lesson">Lesson 1</a>
    <a href="#" class="lesson">Lesson 2</a>
    <a href="#" class="lesson">Lesson 3</a>
    <a href="#" class="lesson">Lesson 4</a>
</section>

<div class="headline">4TH QUARTER EVENTS</div>
<section class="gallery">
    <div class="card">
        <img src="event1.jpg" alt="Event 1">
        <div class="caption">Event 1</div>
    </div>
    <div class="card">
        <img src="event2.jpg" alt="Event 2">
        <div class="caption">Event 2</div>
    </div>
    <div class="card">
        <img src="event3.jpg" alt="Event 3">
        <div class="caption">Event 3</div>
    </div>
</section>

<div class="headline">NOLI ME TANGERE</div>
<section class="gallery noli">
    <div class="card">
        <img src="noli1.png" alt="Noli Image 1">
    </div>
    <div class="card">
        <img src="noli2.png" alt="Noli Image 2">
    </div>
</section>

<div class="video-link">
    <a href="https://youtu.be/Z8vosFU6Jo4?si=TWdNaHryBOlnzZoW" target="_blank">
        IBARRA: Himig ng Himagsikan
    </a>
</div>

<div class="bottom">
    <a href="tle.html" class="btn">Return</a>
</div>

</body>
</html>
